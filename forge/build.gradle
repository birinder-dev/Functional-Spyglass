plugins {
    id 'java'
}

group = 'dev.birinder.spyglass'
version = '1.0.0'
base.archivesName = 'insight_glass-forge-1.17-1.20.4'

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    maven { url = 'https://maven.neoforged.net/releases/' }
}

dependencies {
    compileOnly files('C:/Users/HP/.gradle/caches/neoformruntime/artifacts/minecraft_1.21.1_client.jar')
    compileOnly 'org.spongepowered:mixin:0.8.5'
    compileOnly 'org.slf4j:slf4j-api:2.0.7'
    compileOnly 'net.minecraftforge:eventbus:6.0.8'
    compileOnly 'net.neoforged:fmlloader:1.20.4-20.4.80'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : 'insight_glass',
            'Specification-Vendor'    : 'Birinder',
            'Specification-Version'   : '1',
            'Implementation-Title'    : 'Insight Glass',
            'Implementation-Version'  : project.version,
            'Implementation-Vendor'   : 'Birinder',
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            'MixinConfigs'            : 'insight_glass.mixins.json'
        ])
    }
}
